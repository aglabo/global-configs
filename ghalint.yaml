# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/ghalint/main/json-schema/ghalint.json

# Exclude specific policies if needed
excludes:
  # Reusable workflows can't be locked by actions.lock; pin by tag (aglabo/ci-platform is first-party)
  - policy_name: action_ref_should_be_full_length_commit_sha
    action_name: aglabo/ci-platform/.github/workflows/*
